<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新标签页 · 风格预览（A 纸白 / C 点阵）</title>

<!-- 唯一的设计取值来源。本页不再重复定义任何颜色/圆角/字号/阴影/动效。 -->
<link rel="stylesheet" href="LineTab/tokens.css">

<link rel="stylesheet" href="preview.css">
</head>
<body>

<div class="bar">
  <button type="button" data-target="paper" aria-pressed="true">A 纸白</button>
  <button type="button" data-target="grid" aria-pressed="false">C 点阵</button>
  <span class="sep"></span>
  <button type="button" data-dark aria-pressed="false">暗色</button>
</div>

<!-- ===== A 纸白 ===== -->
<section class="stage" data-style="paper" data-active>
  <div class="head">
    <div class="clock">09:41</div>
    <div class="date">3月6日 星期五</div>
  </div>
  <div class="middle">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="ph">搜索</span>
      <span class="key">/</span>
    </div>
    <nav class="tiles">
      <a class="tile" href="#"><span class="fav">B</span><span class="name">哔哩哔哩</span></a>
      <a class="tile" href="#"><span class="fav">G</span><span class="name">GitHub</span></a>
      <a class="tile" href="#"><span class="fav">知</span><span class="name">知乎</span></a>
      <a class="tile" href="#"><span class="fav">Y</span><span class="name">YouTube</span></a>
      <a class="tile" href="#"><span class="fav">N</span><span class="name">Notion</span></a>
      <a class="tile" href="#"><span class="fav">豆</span><span class="name">豆瓣</span></a>
      <a class="tile" href="#"><span class="fav">X</span><span class="name">小红书</span></a>
      <a class="tile" href="#"><span class="fav">微</span><span class="name">微博</span></a>
      <a class="tile" href="#"><span class="fav">R</span><span class="name">Reddit</span></a>
      <a class="tile" href="#"><span class="fav">+</span><span class="name">添加</span></a>
    </nav>
  </div>

  <button class="settings" type="button" aria-label="设置" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h9M19 8h1M4 16h3M13 16h7"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
  </button>

  <div class="panel" hidden>
    <div class="row"><span class="rl">默认搜索引擎</span><span class="rv">Bing <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <div class="row"><span class="rl">快捷方式来源</span><span class="rv">常用网站 <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <div class="row"><span class="rl">暗色</span><span class="check" role="switch" tabindex="0" aria-checked="false" aria-label="暗色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 5 5 9-11"/></svg></span></div>
  </div>
</section>

<!-- ===== C 点阵 ===== -->
<section class="stage" data-style="grid">
  <div class="head">
    <div class="clock">09:41</div>
    <div class="date">3月6日 星期五</div>
  </div>
  <div class="middle">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="ph">搜索</span>
      <span class="key">/</span>
    </div>
    <nav class="tiles">
      <a class="tile" href="#"><span class="fav">B</span><span class="name">哔哩哔哩</span></a>
      <a class="tile" href="#"><span class="fav">G</span><span class="name">GitHub</span></a>
      <a class="tile" href="#"><span class="fav">知</span><span class="name">知乎</span></a>
      <a class="tile" href="#"><span class="fav">Y</span><span class="name">YouTube</span></a>
      <a class="tile" href="#"><span class="fav">N</span><span class="name">Notion</span></a>
      <a class="tile" href="#"><span class="fav">豆</span><span class="name">豆瓣</span></a>
      <a class="tile" href="#"><span class="fav">X</span><span class="name">小红书</span></a>
      <a class="tile" href="#"><span class="fav">微</span><span class="name">微博</span></a>
      <a class="tile" href="#"><span class="fav">R</span><span class="name">Reddit</span></a>
      <a class="tile" href="#"><span class="fav">+</span><span class="name">添加</span></a>
    </nav>
  </div>

  <button class="settings" type="button" aria-label="设置" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h9M19 8h1M4 16h3M13 16h7"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
  </button>

  <div class="panel" hidden>
    <div class="row"><span class="rl">默认搜索引擎</span><span class="rv">Bing <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <div class="row"><span class="rl">快捷方式来源</span><span class="rv">常用网站 <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <div class="row"><span class="rl">暗色</span><span class="check" role="switch" tabindex="0" aria-checked="false" aria-label="暗色"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 5 5 9-11"/></svg></span></div>
  </div>
</section>

<script>
const stages = [...document.querySelectorAll('.stage')];
const styleButtons = [...document.querySelectorAll('.bar button[data-target]')];
const darkButton = document.querySelector('.bar button[data-dark]');
const checks = [...document.querySelectorAll('.check')];

let dark = false;

function show(name) {
  stages.forEach(s => s.toggleAttribute('data-active', s.dataset.style === name));
  styleButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.target === name)));
}

function applyDark(on) {
  dark = on;
  stages.forEach(s => on ? s.setAttribute('data-theme', 'dark') : s.removeAttribute('data-theme'));
  darkButton.setAttribute('aria-pressed', String(on));
  checks.forEach(c => c.setAttribute('aria-checked', String(on)));
}

styleButtons.forEach(b => b.addEventListener('click', () => show(b.dataset.target)));
darkButton.addEventListener('click', () => applyDark(!dark));

checks.forEach(c => {
  c.addEventListener('click', () => applyDark(!dark));
  c.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); applyDark(!dark); }
  });
});

// 每个舞台的设置按钮只开合自己的面板
stages.forEach(stage => {
  const btn = stage.querySelector('.settings');
  const panel = stage.querySelector('.panel');
  btn.addEventListener('click', () => {
    const open = panel.hasAttribute('hidden');
    panel.toggleAttribute('hidden', !open);
    btn.setAttribute('aria-expanded', String(open));
  });
});

// 键盘：1-2 切候选（只剩 A 纸白 / C 点阵两套），d 切暗色
addEventListener('keydown', e => {
  if (e.target.closest('.check')) return;
  const i = Number(e.key) - 1;
  if (styleButtons[i]) show(styleButtons[i].dataset.target);
  if (e.key === 'd' || e.key === 'D') applyDark(!dark);
});

// 支持 #<候选>[+dark][+panel][+bare] 直接摆好状态，方便截图与视觉回归比对：
//   #paper          —— A 纸白
//   #grid           —— C 点阵
//   #paper+dark     —— A 的自动暗色
//   #grid+panel     —— C 点阵并展开设置面板
//   #paper+bare     —— 藏掉底部工具条（截图/视觉回归用，截到的是真实的新标签页）
const parts = location.hash.slice(1).split('+').filter(Boolean);
const picked = parts.find(p => styleButtons.some(b => b.dataset.target === p));
if (picked) show(picked);
if (parts.includes('dark')) applyDark(true);
if (parts.includes('bare')) document.body.classList.add('bare');
if (parts.includes('panel')) {
  stages.forEach(s => {
    s.querySelector('.panel').removeAttribute('hidden');
    s.querySelector('.settings').setAttribute('aria-expanded', 'true');
  });
}
</script>
</body>
</html>
